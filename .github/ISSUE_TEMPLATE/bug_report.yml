name: Bug report
description: Unexpected extract, CLI, TUI, MCP, or web behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for incorrect or failing behavior. Read [AGENTS.md](https://github.com/Mellow-Artificial-Intelligence/openextract-ts/blob/main/AGENTS.md) before filing from an agent.

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where the bug showed up
      options:
        - Library (extract / extractMany / Extractor)
        - CLI
        - TUI
        - MCP
        - Web UI
        - Docs
    validations:
      required: true

  - type: dropdown
    id: style
    attributes:
      label: Extraction style
      options:
        - direct
        - search
        - code
        - unknown / not applicable
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Short description. Include the typed error name if you have one (`ModelError`, `SchemaValidationError`, `InputTooLargeError`, `UrlFetchError`, `ProviderNotInstalledError`).
      placeholder: extract() threw SchemaValidationError on a valid invoice PDF…
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal TypeScript, CLI, or MCP call. Redact secrets.
      placeholder: |
        ```ts
        import { z } from "zod";
        import { extract } from "openextract";

        await extract(Schema, "openai/gpt-5.5", "./file.pdf", { style: "direct" });
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Error message, stack, or MCP tool payload
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: openextract version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "22"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      description: AI Gateway id, or "mock" for unit tests
      placeholder: openai/gpt-5.5

  - type: textarea
    id: additional
    attributes:
      label: Extra context
      description: Media type, input kind (path / URL / bytes), OS, MCP transport (stdio / HTTP)
